[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperquant-agents"
version = "0.1.0"
description = "Harness that lets LLM agents play Minecraft 1.12.2 as ordinary players through the AgentBridge mod"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hq-agents = "hyperquant_agents.cli:main"

[tool.setuptools]
packages = ["hyperquant_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
